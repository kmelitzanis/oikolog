<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!--
        Maskable variant: full-bleed background (no transparent corners, since
        the launcher may crop to any shape) and the mark held inside the 80%
        safe zone.
    -->
    <rect width="512" height="512" fill="#0f172a"/>
    <g transform="translate(112, 36.5) scale(18)">
        <rect x="2" y="4" width="7" height="2.6" rx="1.3" fill="#ffffff"/>
        <rect x="2" y="8.6" width="12" height="2.6" rx="1.3" fill="#ffffff"/>
        <rect x="2" y="13.2" width="9" height="2.6" rx="1.3" fill="#ffffff"/>
        <rect x="2" y="17.8" width="12" height="2.6" rx="1.3" fill="#f59e0b"/>
    </g>
</svg>
