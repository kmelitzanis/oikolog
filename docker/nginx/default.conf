server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Don't advertise the nginx version on error pages and headers.
    server_tokens off;

    # nginx refuses bodies over 1 MB by default, which turned every avatar,
    # vehicle photo and receipt above that into a bare "413" page. Keep in
    # step with upload_max_filesize / post_max_size in docker/php/oikolog.ini.
    client_max_body_size 40m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php index.html;

    # Serve uploaded files directly from the storage volume.
    # The public/storage symlink cannot cross Docker volume boundaries,
    # so we serve /storage/* directly from the storage app/public path.
    #
    # `^~` stops the regex locations below from being consulted, so nothing
    # under /storage/ can ever be handed to PHP — whatever its extension.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        # add_header in a location replaces the server-level ones, so the
        # protections are repeated here. The CSP neutralises an uploaded file
        # that a browser might otherwise run as a page.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # A .php path that does not exist 404s here rather than reaching PHP-FPM.
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        # The app sends these too (SecurityHeaders middleware); nginx adds
        # the same values above, so drop the app's copies to avoid doubles.
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
