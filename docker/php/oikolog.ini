; Runtime PHP settings for the app container.

; Uploads: receipts may be 10 MB each and a bill form can carry several.
; nginx's client_max_body_size (docker/nginx/default.conf) must stay >= post_max_size.
upload_max_filesize = 12M
post_max_size = 40M
max_file_uploads = 12

; Don't advertise the PHP version in response headers.
expose_php = Off

; Errors belong in the log, never in a page.
display_errors = Off
log_errors = On

; Session cookie hardening (Laravel sets its own cookie flags as well).
session.cookie_httponly = 1
session.use_strict_mode = 1
