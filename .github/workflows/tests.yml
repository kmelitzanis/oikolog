name: Tests

# The oldest supported PHP and the one the Docker image ships. 8.3 catches
# syntax newer than the minimum slipping in; 8.5 catches deprecations before
# they reach the image.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.5" ]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, exif, gd, intl, pdo_sqlite, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Pages render through @vite, so the tests need a build manifest.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build assets
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
